# Pipeline: Testes -> Imagem -> Deploy HOMOL (develop) / Deploy PRD (main, com aprovacao)
name: CI/CD

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: senai_fastapi

jobs:
  Build:
    name: Compilar Projeto
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Executar testes com pytest
        run: PYTHONPATH=. pytest tests/ -v --tb=short

  Imagem:
    name: Construindo Imagem para Docker
    runs-on: ubuntu-latest
    needs: Build
    if: github.event_name == 'push'
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e Push Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.ref_name == 'main' && 'latest' || 'homolog' }}

  Deploy_Homologacao:
    name: Deploy HOMOL
    runs-on: ubuntu-latest
    needs: Imagem
    if: github.ref == 'refs/heads/develop'
    environment: homologacao
    steps:
      - name: Deploy via SSH na EC2 de homologacao
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:homolog
            sudo docker stop ${{ env.IMAGE_NAME }} 2>/dev/null || true
            sudo docker rm ${{ env.IMAGE_NAME }} 2>/dev/null || true
            sudo docker run -d \
              --name ${{ env.IMAGE_NAME }} \
              --restart unless-stopped \
              -p 8080:8080 \
              ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:homolog
            sleep 5
            curl -f http://localhost:8080/health || exit 1
            echo "Deploy HOMOL concluido com sucesso!"
            sudo docker image prune -f

  Deploy_Producao:
    name: Deploy PRD
    runs-on: ubuntu-latest
    needs: Imagem
    if: github.ref == 'refs/heads/main'
    environment: producao
    steps:
      - name: Deploy via SSH na EC2 de producao
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            sudo docker stop ${{ env.IMAGE_NAME }} 2>/dev/null || true
            sudo docker rm ${{ env.IMAGE_NAME }} 2>/dev/null || true
            sudo docker run -d \
              --name ${{ env.IMAGE_NAME }} \
              --restart unless-stopped \
              -p 8080:8080 \
              ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            sleep 5
            curl -f http://localhost:8080/health || exit 1
            echo "Deploy PRD concluido com sucesso!"
            sudo docker image prune -f