# Pipeline completo: Testes -> Imagem no Docker Hub -> Deploy na EC2
name: CI/CD

# Quando o pipeline roda
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # JOB 1: instala as dependências e roda os testes
  Build:
    name: Compilar Projeto
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Executar testes com pytest
        run: PYTHONPATH=. pytest tests/ -v --tb=short

  # JOB 2: constrói a imagem e publica no Docker Hub
  Imagem:
    name: Construindo Imagem para Docker
    runs-on: ubuntu-latest
    needs: Build
    # só publica em push, não em pull request
    if: github.event_name == 'push'
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e Push Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # usa o seu usuário do Docker Hub pelo secret
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/senai_fastapi:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/senai_fastapi:${{ github.sha }}

  # JOB 3: conecta na EC2 por SSH e sobe o container novo
  Deploy:
    name: Implantação AWS
    runs-on: ubuntu-latest
    needs: Imagem
    steps:
      - name: Deploy via SSH na EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Baixa a imagem nova
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/senai_fastapi:latest

            # Para e remove o container atual (ignora erro se não existir)
            sudo docker stop senai_fastapi 2>/dev/null || true
            sudo docker rm senai_fastapi 2>/dev/null || true

            # Sobe o container novo
            sudo docker run -d \
              --name senai_fastapi \
              --restart unless-stopped \
              -p 8080:8080 \
              ${{ secrets.DOCKERHUB_USERNAME }}/senai_fastapi:latest

            # Health check pós-deploy
            sleep 5
            curl -f http://localhost:8080/health || exit 1
            echo "Deploy concluído com sucesso!"

            # Remove imagens antigas para economizar disco
            sudo docker image prune -f